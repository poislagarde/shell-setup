# herdr configuration — symlinked to ~/.config/herdr/config.toml (edit either;
# one file). Reload with `herdr server reload-config`.

onboarding = false

[ui]
agent_panel_sort = "priority"

[ui.toast]
delivery = "terminal"

[ui.toast.clipboard]
enabled = false

[ui.sidebar.spaces]
rows = [
  ["state_icon", { token = "$short_space", bold = true }],
  [{ token = "$short_branch", dim = true }, "git_status"],
]

[theme]
name = "solarized"
auto_switch = false

# Keybinds are Omarchy's herdr defaults, copied from
# /usr/share/omarchy/config/herdr/config.toml. Compare after Omarchy updates
# and copy changes here. The [[keys.command]] entries below are
# this repo's additions. Keep the README "herdr keybinds" tables in sync.
#
# Ghostty unbinds its Linux Alt+1..9 and Ctrl+Alt+arrow defaults so these reach
# herdr, and sends Shift+Enter as CSI 13;2u so it never reads as Alt+Enter (see
# ghostty/config). Omarchy's Hyprland binds the Super chords, so none are used.
# Omarchy's Alt+Left/Right tab keys are left out: Ghostty sends them as word
# jumps (Esc b / Esc f).
[keys]
prefix = "ctrl+space"

# Config and help
reload_config = "prefix+q"
help = "prefix+?"
detach = "prefix+d"

# Copy mode
copy_mode = "prefix+["

# Panes
split_horizontal = ["prefix+h", "alt+enter"]
split_vertical = ["prefix+v", "alt+shift+enter"]
close_pane = ["prefix+x", "alt+esc"]
zoom = "prefix+z"
last_pane = "prefix+;"

focus_pane_left = "ctrl+alt+left"
focus_pane_down = "ctrl+alt+down"
focus_pane_up = "ctrl+alt+up"
focus_pane_right = "ctrl+alt+right"

resize_mode = ["prefix+ctrl+left", "prefix+ctrl+down", "prefix+ctrl+up", "prefix+ctrl+right"]

resize_pane_left = "ctrl+alt+shift+left"
resize_pane_down = "ctrl+alt+shift+down"
resize_pane_up = "ctrl+alt+shift+up"
resize_pane_right = "ctrl+alt+shift+right"

rename_pane = "prefix+shift+o"

# Tabs (alt+t is this repo's addition)
new_tab = ["prefix+c", "alt+t"]
rename_tab = "prefix+r"
close_tab = "prefix+k"
switch_tab = ["prefix+1..9", "alt+1..9"]
previous_tab = "prefix+p"
next_tab = "prefix+n"

move_tab_previous = "alt+shift+left"
move_tab_next = "alt+shift+right"

# Spaces
new_workspace = "prefix+shift+c"
rename_workspace = "prefix+shift+r"
close_workspace = "prefix+shift+k"
previous_workspace = ["prefix+shift+p", "alt+up"]
next_workspace = ["prefix+shift+n", "alt+down"]

[[keys.command]]
key = "prefix+alt+g"
type = "plugin_action"
description = "new worktree from GitHub PR"
command = "poislagarde.pr-worktree.open"

# Workspace history is independent of pane/tab focus within a space.
[[keys.command]]
key = "alt+backtick"
type = "plugin_action"
description = "back through space history"
command = "poislagarde.last-workspace.back"

[[keys.command]]
key = "alt+shift+backtick"
type = "plugin_action"
description = "forward through space history"
command = "poislagarde.last-workspace.forward"

[[keys.command]]
key = "alt+~"
type = "plugin_action"
description = "forward through space history"
command = "poislagarde.last-workspace.forward"

# Claude Code launchers. The new pane
# gets a normal shell and the command is typed into it, so the zshrc `claude`
# alias and exported vars apply.
[[keys.command]]
key = "ctrl+alt+="
type = "shell"
description = "new space running Claude Code at $HOME"
command = "~/.shell-setup/claude-pane.sh space"

[[keys.command]]
key = "ctrl+alt+p"
type = "shell"
description = "new space running Claude Code in $PROJECTS_DIR"
command = "~/.shell-setup/claude-pane.sh space claude --projects"

[[keys.command]]
key = "ctrl+alt+shift+="
type = "shell"
description = "split right running Claude Code"
command = "~/.shell-setup/claude-pane.sh right"

[[keys.command]]
key = "ctrl+alt+shift+-"
type = "shell"
description = "split down running Claude Code"
command = "~/.shell-setup/claude-pane.sh down"
