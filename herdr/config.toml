# herdr configuration — symlinked to ~/.config/herdr/config.toml (edit either;
# one file). Reload with `herdr server reload-config`.

onboarding = false

[ui]
agent_panel_sort = "priority"

[ui.toast]
delivery = "system"

[theme]
name = "tokyo-night"
auto_switch = false

# Keybinds mirror the tmux chords in tmux/tmux.conf; each array keeps herdr's
# default first. Shifted punctuation is bound in both forms the terminal may
# send (shift+key under the kitty keyboard protocol, the shifted character
# otherwise). Keep the README "herdr keybinds" table in sync.
[keys]
settings = "prefix+shift+s"
detach = ["prefix+q", "prefix+d"]
workspace_picker = ["prefix+w", "prefix+s", "alt+shift+s"]
# Hyper = Caps Lock via Karabiner = shift+ctrl+option+cmd.
switch_workspace = ["prefix+shift+1..9", "ctrl+alt+shift+cmd+1..9"]
next_workspace = ["prefix+)", "ctrl+alt+shift+cmd+]"]
previous_workspace = ["prefix+(", "ctrl+alt+shift+cmd+["]
rename_workspace = ["prefix+shift+w", "prefix+$"]
new_tab = ["prefix+c", "alt+="]
next_tab = ["prefix+n", "alt+backtick"]
previous_tab = ["prefix+p", "alt+shift+backtick", "alt+~"]
switch_tab = ["prefix+1..9", "alt+1..9"]
rename_tab = ["prefix+shift+t", "prefix+comma"]
close_tab = ["prefix+shift+x", "prefix+ampersand"]
split_vertical = ["prefix+v", "alt+shift+=", "alt+plus"]
split_horizontal = ["prefix+minus", "alt+shift+minus", "alt+_"]
zoom = ["prefix+z", "alt+shift+enter"]
focus_pane_left = ["prefix+h", "cmd+alt+left"]
focus_pane_down = ["prefix+j", "cmd+alt+down"]
focus_pane_up = ["prefix+k", "cmd+alt+up"]
focus_pane_right = ["prefix+l", "cmd+alt+right"]

# Claude Code launchers (tmux: C-M-=, C-M-p, C-M-S-=, C-M-S--). The new pane
# gets a normal shell and the command is typed into it, so the zshrc `claude`
# alias and exported vars apply.
[[keys.command]]
key = "ctrl+alt+="
type = "shell"
description = "new tab running Claude Code at $HOME"
command = "~/.shell-setup/claude-pane.sh tab"

[[keys.command]]
key = "ctrl+alt+p"
type = "shell"
description = "new tab running Claude Code in $PROJECTS_DIR"
command = "~/.shell-setup/claude-pane.sh tab 'cd \"$PROJECTS_DIR\" && claude'"

[[keys.command]]
key = "ctrl+alt+shift+="
type = "shell"
description = "split right running Claude Code"
command = "~/.shell-setup/claude-pane.sh right"

[[keys.command]]
key = "ctrl+alt+shift+-"
type = "shell"
description = "split down running Claude Code"
command = "~/.shell-setup/claude-pane.sh down"
