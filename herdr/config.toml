# herdr configuration — symlinked to ~/.config/herdr/config.toml (edit either;
# one file). Reload with `herdr server reload-config`.

onboarding = false

[ui]
agent_panel_sort = "priority"

[ui.toast]
delivery = "system"

[theme]
name = "tokyo-night"
auto_switch = false

# Keybinds mirror tmux/tmux.conf with tmux windows <> herdr spaces and tmux
# panes <> herdr tabs; each array keeps herdr's default first. tmux reads Cmd
# as Meta, so Cmd and Alt chords land on the same tmux binding. Shifted punctuation is bound in both forms the terminal may
# send (shift+key under the kitty keyboard protocol, the shifted character
# otherwise). Keep the README "herdr keybinds" table in sync.
[keys]
settings = "prefix+shift+s"
detach = ["prefix+q", "prefix+d"]
workspace_picker = ["prefix+w", "prefix+s", "alt+shift+s"]
new_workspace = ["prefix+shift+n", "alt+="]
switch_workspace = ["prefix+shift+1..9", "alt+1..9"]
next_workspace = ["prefix+)", "alt+]"]
previous_workspace = ["prefix+(", "alt+["]
rename_workspace = ["prefix+shift+w", "prefix+$"]
# Cmd+Shift chords reach herdr through Ghostty forwarders (see ghostty/config).
new_tab = ["prefix+c", "alt+shift+=", "alt+plus"]
next_tab = ["prefix+n", "alt+shift+]", "alt+}", "cmd+shift+]", "cmd+}"]
previous_tab = ["prefix+p", "alt+shift+[", "alt+{", "cmd+shift+[", "cmd+{"]
switch_tab = ["prefix+1..9", "alt+shift+1..9"]
rename_tab = ["prefix+shift+t", "prefix+comma"]
close_tab = ["prefix+shift+x", "prefix+ampersand"]
split_vertical = ["prefix+v", "cmd+shift+="]
split_horizontal = ["prefix+minus", "cmd+shift+-"]
zoom = ["prefix+z", "alt+shift+enter"]
focus_pane_left = ["prefix+h", "cmd+alt+left"]
focus_pane_down = ["prefix+j", "cmd+alt+down"]
focus_pane_up = ["prefix+k", "cmd+alt+up"]
focus_pane_right = ["prefix+l", "cmd+alt+right"]
# Agents cycle in agent-panel order (priority sort: attention-needing first).
next_agent = "alt+tab"
previous_agent = "alt+shift+tab"

# Claude Code launchers (tmux: C-M-=, C-M-p, C-M-S-=, C-M-S--). The new pane
# gets a normal shell and the command is typed into it, so the zshrc `claude`
# alias and exported vars apply.
[[keys.command]]
key = "ctrl+alt+="
type = "shell"
description = "new space running Claude Code at $HOME"
command = "~/.shell-setup/claude-pane.sh space"

[[keys.command]]
key = "ctrl+alt+p"
type = "shell"
description = "new space running Claude Code in $PROJECTS_DIR"
command = "~/.shell-setup/claude-pane.sh space claude \"${PROJECTS_DIR:-$HOME/darwin-ai/darwin-platform}\""

[[keys.command]]
key = "ctrl+alt+shift+="
type = "shell"
description = "split right running Claude Code"
command = "~/.shell-setup/claude-pane.sh right"

[[keys.command]]
key = "ctrl+alt+shift+-"
type = "shell"
description = "split down running Claude Code"
command = "~/.shell-setup/claude-pane.sh down"
