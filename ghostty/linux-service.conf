# Linux: loaded last by Ghostty's D-Bus service, through the systemd override
# ghostty/linux-service-override.conf (bootstrap §16). The service is
# started windowless and then asked for each window, so it must not open one
# of its own. A --config-file on the command line loads after every
# config-file include, so this beats ghostty/linux.conf.
initial-window = false
