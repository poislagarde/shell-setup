# systemd drop-in for Ghostty's D-Bus service (app-com.mitchellh.ghostty.service),
# symlinked into ~/.config/systemd/user/app-com.mitchellh.ghostty.service.d/
# by bootstrap §16 on Linux. Same command as the packaged unit, plus
# ghostty/linux-service.conf (via ~/.shell-setup) so the service starts
# windowless.
[Service]
ExecStart=
ExecStart=ghostty --gtk-single-instance=true --initial-window=false --config-file=%h/.shell-setup/ghostty-service.conf
