# Linux: loaded after ghostty/config by the managed block in
# ~/.config/ghostty/config (bootstrap §16).

# Open a window when launched directly (xdg-terminal-exec, `ghostty -e`), as
# Omarchy does for its default terminal. Ghostty's D-Bus service stays
# windowless through ghostty/linux-service.conf, which its systemd override
# loads last, so a launcher start doesn't open a second window.
initial-window = true
