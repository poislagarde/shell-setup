set -g mouse on
set -g extended-keys always
set -as terminal-features 'xterm*:extkeys'

# Shift+Space → plain space for every app in a pane. `extended-keys always`
# would otherwise forward it as the CSI 27 modified-key form (^[[27;2;32~),
# which shells and TUIs decode as garbage. Normalize here rather than with a
# Ghostty keybind: a keybind fires ahead of macOS text input and would swallow
# a pending dead key (US-International `"` + Shift+Space must still type `"`).
# Copy-mode keys come from their own table, so mirror Space there too.
bind -n S-Space send-keys Space
bind -T copy-mode-vi S-Space send-keys -X begin-selection

# Tell tmux the outer terminal (Ghostty) understands DECSCUSR cursor-shape
# escapes, so cursor-style requests from apps running inside tmux (e.g. zsh
# setting a blinking bar in precmd) are forwarded instead of swallowed. The
# tmux-256color / xterm-256color terminfo entries don't ship Ss/Se by default,
# so this is what enables the pass-through.
set -as terminal-features 'xterm*:cstyle'

# Force a blinking bar cursor across tmux panes — including copy-mode. When
# left at "default", scrolling drops into copy-mode and tmux draws its copy
# cursor as a block. Setting cursor-style makes tmux own the cursor shape, so
# it stays a blinking bar everywhere (and makes the zsh precmd DECSCUSR hack
# redundant inside tmux).
set -g cursor-style blinking-bar

# Bigger scrollback than the stingy 2000-line default.
set -g history-limit 50000

# Forward terminal focus events into tmux (so neovim, etc. can react).
set -g focus-events on

# Number windows/panes from 1 — matches the M-1..M-9 bindings below.
set -g base-index 1
setw -g pane-base-index 1

# When a window is closed, shift later windows down so numbering stays tight.
set -g renumber-windows on

# True color (24-bit) inside tmux — required for themes to look right.
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm*:Tc"

# OSC 8 hyperlinks. tmux only forwards them to terminals it knows support the
# feature; without this it parses them and drops them on the floor.
set -as terminal-features "xterm-ghostty:hyperlinks"

# Selecting text in copy-mode also goes to the macOS clipboard.
set -g set-clipboard on

# Let DCS escape sequences (kitty graphics protocol, sixel images) pass through
# to the outer terminal — useful for image-rendering tools (kitten icat,
# imgcat, sixel-based plots) inside tmux panes.
set -g allow-passthrough on

bind -T copy-mode-vi WheelUpPane   select-pane \; send-keys -X -N 2 scroll-up
bind -T copy-mode-vi WheelDownPane select-pane \; send-keys -X -N 2 scroll-down
bind -T copy-mode    WheelUpPane   select-pane \; send-keys -X -N 2 scroll-up
bind -T copy-mode    WheelDownPane select-pane \; send-keys -X -N 2 scroll-down

# Don't cycle windows when scrolling over the status bar.
unbind -T root WheelUpStatus
unbind -T root WheelDownStatus

set -g status-left '#{?#{@shell-setup-persistence-warning},#[fg=colour203]#[bold] #{@shell-setup-persistence-warning} #[default],}'
set -g status-left-length 28
# Pane title / command / branch / cwd live on a per-pane border line
# (pane-border-status, at the bottom of each pane), not status-right — keeping
# the status line proper free for window switching.
set -g status-right ""
set -g status-right-length 0
# Bar background = #2a2a2a, the same shade as the pane-border band below, so
# the border strips and the status line read as one continuous dark system at
# the bottom of the screen. MUST stay in sync with pane-border-style /
# pane-active-border-style further down and the taper-arrow backgrounds in
# build-pane-border-format.sh (##2a2a2a).
set -g status-style "bg=#2a2a2a,fg=#c0c0c0"
set -g pane-border-status bottom
# Per-pane bottom line, powerline-style: dark slate slab segments with the
# hues in the text (title orange, command purple, branch green/yellow, cwd
# blue; inactive panes darker slabs + grey text), tapering to  arrow points
# toward the middle filler; the right group sits square against the pane edge,
# the left group opens with a  taper to dress tmux's hardcoded 2-cell strip
# margin. Left: "title  ❯ command"; right: " branch   cwd" (branch text:
# green clean / yellow dirty; inactive dirty a muted colour94). It degrades responsively as the
# pane narrows (hide glyphs/❯ → drop the command → proportionally trim
# title+cwd → trim the branch), always keeping ≥1 filler column. The branch
# and dirty flag are read from the @branch/@dirty pane options, maintained by
# the status-refresh.sh loop below — never from #(git …) jobs, whose per-client
# cold cache flashes the bar on window switches. The format string is several
# KB (the width sub-expressions repeat), so it is generated by
# build-pane-border-format.sh into pane-border-format.conf (symlinked to
# ~/.shell-setup/) and sourced below — edit the builder, re-run it, commit the
# .conf.
# Borders as SOLID dim strips, not line glyphs: fg=bg fills every border cell
# (the glyph is painted invisibly on itself), so the bottom powerline bar sits
# on a continuous band and vertical splits become 1-cell solid columns.
#
# Active and inactive MUST be the SAME color: tmux paints the 2-cell margin
# left of each border-status strip by cell-adjacency to the active pane
# (draw_borders), but the strip itself by its owner pane's active state
# (make_pane_status) — with two shades those rules disagree on the border row
# above/below the focused pane and show a 2-cell seam. Focus is signaled by
# the segment slab/text colors instead: active slabs sit LIGHTER than this
# band, inactive slabs DARKER. The hex MUST also stay in sync with the
# taper-arrow backgrounds in build-pane-border-format.sh (##2a2a2a) — a
# mismatch shows as a notch behind the taper points.
set -g pane-border-style "fg=#2a2a2a bg=#2a2a2a"
set -g pane-active-border-style "fg=#2a2a2a bg=#2a2a2a"

# Focus cue: tint only the active pane's default background. Leaves foreground
# colors alone, so inactive pane content doesn't get the washed-out look that
# fg dimming produces.
set -g window-style "bg=default"
set -g window-active-style "bg=#242424"

source-file ~/.shell-setup/pane-border-format.conf
# Window label is hybrid: while automatic-rename is on (the default) show the
# descriptive pane_title; once you manually rename a window tmux turns
# automatic-rename off, so it switches to showing your custom name (#W).
# Also fall back to pane_title when #W is empty — renaming to "" leaves
# automatic-rename off (tmux doesn't re-enable it), which would otherwise show
# a blank label.
#
# Claude Code prefixes its pane_title with a status glyph: "✳ " when
# idle/queued, or a spinner frame while working — a braille char ("⠂ "/"⠐ ")
# in older versions, a quadrant circle ("◐ "/"◓ "/"◑ "/"◒ ") in newer ones.
# We STRIP that leading glyph from the displayed text — `s/^[✳⠀-⣿◐-◓] //`
# matches "✳", any Braille-block char (U+2800–U+28FF), or a quadrant circle
# (U+25D0–U+25D3) followed by a space —
# reclaiming 2 columns so the =25 budget holds more real title. The lost status
# is re-encoded as the segment COLOR instead (see below), so nothing is lost.
# Stripping only happens in the auto-rename branch; a manually renamed window
# (#W) is left alone.
#
# Activity → color, in three states read from ONE window option: the
# @assistant-window that status-refresh.sh maintains, holding "input" (an
# assistant is blocked on you) or "busy" (one is working) or nothing. It
# aggregates the per-pane @assistant-state options the assistant-activity hooks
# write (registered in ~/.claude/settings.json and ~/.codex/hooks.json), and
# falls back to the title glyph above for a pane whose assistant reports no
# state at all. Aggregating in the loop is what keeps these formats a plain
# three-way choice rather than a per-pane test repeated in every color slot.
#
# Tabs are dark slabs sitting on the #2a2a2a band (same family as the
# pane-border segments): plain and idle = #363636 slab with light grey #c0c0c0
# text. Idle deliberately looks the SAME as a regular non-assistant window —
# only active work stands out. Working = the slab stays put and the TEXT
# breathes green: a triangle wave over four luminance steps (level held in
# @pulse, ticked by status-refresh.sh below) from grey-green #8f9a5a up to
# bright lime #d6df7b — motion with no background flash. Waiting on YOU (a
# permission prompt, a question, a plan to approve) breathes MAGENTA over
# @pulse2, which the loop ticks twice as fast: nothing proceeds until you look,
# so it outranks working on a window holding both. The current window is an
# orange slab (colour173 = #d7875f) capped with powerline / tapers whose fg
# matches the slab and whose bg is the #2a2a2a band; while working it breathes
# the brightened-orange ramp (×1.06..1.51 toward light peach) and while waiting
# a magenta slab ramp — the taper fg uses the SAME conditional so the points
# never detach from the slab. Shades are truecolor hex (Tc enabled above).
# Recompute if you change a base. Literal "#" → "##". To make a pulse
# stronger/weaker, widen/narrow its levels; to make it faster/slower, change
# the sleeps in status-refresh.sh.
#
# Why @pulse/@pulse2 instead of the spinner frame: an unfocused Claude pane
# pauses its title spinner (focus-events on), so a background window's frame is
# FROZEN — nothing to animate. And a non-selected window's label is only
# re-expanded when that window is independently redrawn; a plain status repaint
# reuses its cached label. Setting an option forces tmux to re-expand EVERY
# label, so the loop's `set @pulse` both advances the color and repaints the
# frozen labels. The loop only ticks while something is working or waiting, so
# these forced redraws happen only then; while idle, the status loop only does
# its inexpensive polling pass.
#
# Color is DECOUPLED from the text gate above: it comes from the pane options,
# not from the displayed name, so a manually-renamed assistant window (showing
# #W) still gets its colors — those are the windows you most want to monitor.
# The aggregation covers EVERY pane in a window, not just the active one, so an
# agent working in a background split still makes its window breathe.
set -g @pulse 0
set -g @pulse2 0
set -g window-status-format "#[bg=##363636,fg=#{?#{==:#{@assistant-window},input},#{?#{==:#{@pulse2},0},##a05a7a,#{?#{==:#{@pulse2},1},##bf6b91,#{?#{==:#{@pulse2},2},##df7da9,##ff8fc0}}},#{?#{==:#{@assistant-window},busy},#{?#{==:#{@pulse},0},##8f9a5a,#{?#{==:#{@pulse},1},##a8b364,#{?#{==:#{@pulse},2},##c1cc6e,##d6df7b}}},##c0c0c0}}] #I:#{?#{||:#{automatic-rename},#{==:#W,}},#{=25:#{s/^[✳⠀-⣿◐-◓] //:pane_title}},#W} "
set -g window-status-current-format "#[fg=#{?#{==:#{@assistant-window},input},#{?#{==:#{@pulse2},0},##d76fa0,#{?#{==:#{@pulse2},1},##e884b1,#{?#{==:#{@pulse2},2},##f599c2,##ffaed3}}},#{?#{==:#{@assistant-window},busy},#{?#{==:#{@pulse},0},##e48f65,#{?#{==:#{@pulse},1},##ffa373,#{?#{==:#{@pulse},2},##ffb881,##ffcc8f}}},##d7875f}},bg=##2a2a2a]#[fg=##1a1a1a,bg=#{?#{==:#{@assistant-window},input},#{?#{==:#{@pulse2},0},##d76fa0,#{?#{==:#{@pulse2},1},##e884b1,#{?#{==:#{@pulse2},2},##f599c2,##ffaed3}}},#{?#{==:#{@assistant-window},busy},#{?#{==:#{@pulse},0},##e48f65,#{?#{==:#{@pulse},1},##ffa373,#{?#{==:#{@pulse},2},##ffb881,##ffcc8f}}},##d7875f}},bold] #I:#{?#{||:#{automatic-rename},#{==:#W,}},#{=25:#{s/^[✳⠀-⣿◐-◓] //:pane_title}},#W} #[fg=#{?#{==:#{@assistant-window},input},#{?#{==:#{@pulse2},0},##d76fa0,#{?#{==:#{@pulse2},1},##e884b1,#{?#{==:#{@pulse2},2},##f599c2,##ffaed3}}},#{?#{==:#{@assistant-window},busy},#{?#{==:#{@pulse},0},##e48f65,#{?#{==:#{@pulse},1},##ffa373,#{?#{==:#{@pulse},2},##ffb881,##ffcc8f}}},##d7875f}},bg=##2a2a2a]"
set -g window-status-current-style "bg=#d7875f,fg=#1a1a1a,bold"
# Aggregate assistant activity into @assistant-window, tick @pulse/@pulse2 to
# animate the breathe (see block above), and keep the @branch/@dirty pane
# options fresh for the pane-border bar. Only forces redraws while a window is
# working, waiting, or its git state changed; backgrounded; self-guards against
# duplicate loops on reload (so restart the tmux server — or kill the loop,
# remove its ${TMPDIR}/tmux-status-refresh-<pid> lock dir, and re-run this line
# — to pick up edits to the script).
run-shell -b "~/.shell-setup/status-refresh.sh"

# Switching to a window selects the pane that wants you — the pane most recently
# marked by the activity hooks, where an assistant blocked on input outranks one
# that just finished its turn. The mark is consumed on arrival, so a second visit
# restores whichever pane you last used there instead of jumping again. Hooked on
# session-window-changed rather than the window keybinds: it covers every route
# into a window (index keys, next/prev, last-window, the session picker, a client
# switching sessions) with nothing to keep in sync when a binding is added.
set-hook -g session-window-changed 'run-shell -b "~/.shell-setup/assistant-activity/focus-pending.sh \"#{session_name}\""'

# Alt+N → jump to window N (no prefix). Alt is forwarded by Ghostty
# (macos-option-as-alt = true), so these only fire when tmux owns the keys —
# naturally scoping the binding to "inside tmux only". Windows number from 1
# (see base-index above), so Alt+0 reaches window 10 rather than a nonexistent 0.
bind -n M-0 select-window -t 10
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Alt+= → new window (herdr: new space).
# (Alt+Backspace is reserved for delete-word-backward in shell/Claude Code
# via the Ghostty alt+backspace=text:\x17 keybind.)
# Alt+[ / ] cycle windows (herdr: spaces); Alt+Shift+[ / ] cycle panes (herdr:
# tabs). Cmd+Shift+[ / ] arrive as the Alt+Shift keys: tmux reads Cmd as Meta.
bind -n 'M-[' previous-window
bind -n 'M-]' next-window
bind -n 'M-S-[' select-pane -t :.-
bind -n 'M-S-]' select-pane -t :.+
bind -n 'M-{' select-pane -t :.-
bind -n 'M-}' select-pane -t :.+
bind -n 'M-S-{' select-pane -t :.-
bind -n 'M-S-}' select-pane -t :.+
# Alt+Shift+N → pane N, mirroring herdr's tab N (both encodings bound).
bind -n 'M-S-1' select-pane -t :.1
bind -n 'M-!' select-pane -t :.1
bind -n 'M-S-2' select-pane -t :.2
bind -n 'M-@' select-pane -t :.2
bind -n 'M-S-3' select-pane -t :.3
bind -n 'M-#' select-pane -t :.3
bind -n 'M-S-4' select-pane -t :.4
bind -n 'M-$' select-pane -t :.4
bind -n 'M-S-5' select-pane -t :.5
bind -n 'M-%' select-pane -t :.5
bind -n 'M-S-6' select-pane -t :.6
bind -n 'M-^' select-pane -t :.6
bind -n 'M-S-7' select-pane -t :.7
bind -n 'M-&' select-pane -t :.7
bind -n 'M-S-8' select-pane -t :.8
bind -n 'M-*' select-pane -t :.8
bind -n 'M-S-9' select-pane -t :.9
bind -n 'M-(' select-pane -t :.9
bind -n M-= new-window -c "#{HOME}"

# Alt+Shift+S → session picker (tmux's choose-tree, sessions collapsed).
# Selecting a session switches this client to it — useful now that different
# Ghostty surfaces own different sessions. The
# custom format marks every session (attached)/(detached); the default only
# marks attached ones. Window/pane sub-lines (visible when a session is
# expanded with →) fall back to compact labels. Default prefix+s still works;
# the zshrc `tm` picker covers shells outside tmux.
# Bound as M-S-s (not M-S): with extended-keys on, Ghostty's modifyOtherKeys
# path forwards the base codepoint 's' plus the Shift+Alt modifier bits, the
# same form as the M-S-= bindings below — tmux parses that as M-S-s.
bind -n M-S-s choose-tree -Zs -F '#{?session_format,#{session_windows} windows#{?session_attached, (attached), (detached)},#{?window_format,#{window_name},#{pane_title}}}'
bind -n M-S choose-tree -Zs -F '#{?session_format,#{session_windows} windows#{?session_attached, (attached), (detached)},#{?window_format,#{window_name},#{pane_title}}}'

# Cmd+Shift+= splits right, Cmd+Shift+- splits down (herdr: same chords). They
# arrive as M-S-= / M-S-- through Ghostty's CSI u forwarders. Only that base-key
# form is bound on purpose: a real Alt+Shift+= arrives as the shifted character
# (M-S-+ / M-+) and must NOT split here, since herdr uses it for new tab.
bind -n 'M-S-=' split-window -h -c "#{pane_current_path}" \; select-layout -E
bind -n 'M-S--' split-window -v -c "#{pane_current_path}" \; select-layout -E
bind -n DoubleClick1Border select-pane -t = \; select-layout -E

# Right-click a pane border (including the bottom border-status bar) → pane
# context menu. Bound on Border, not Pane: border cells lie outside the pane,
# so the menu opens even when the pane's program owns the mouse (Claude Code,
# vim, …) — tmux has no default binding here. Items mirror the default
# MouseDown3Pane menu; splits inherit the pane's cwd and rebalance, like the
# M-S-= / M-S-- chords.
bind -n MouseDown3Border display-menu -T "#[align=centre]#{pane_index} (#{pane_id})" -t = -x M -y M \
    "#{?#{&&:#{buffer_size},#{!:#{pane_in_mode}}},Paste #[underscore]#{=/9/...:buffer_sample},}" p { paste-buffer } \
    '' \
    "Horizontal Split" h { split-window -h -c "#{pane_current_path}" ; select-layout -E } \
    "Vertical Split" v { split-window -v -c "#{pane_current_path}" ; select-layout -E } \
    '' \
    "#{?#{>:#{window_panes},1},,-}Swap Up" u { swap-pane -U } \
    "#{?#{>:#{window_panes},1},,-}Swap Down" d { swap-pane -D } \
    "#{?pane_marked_set,,-}Swap Marked" s { swap-pane } \
    '' \
    Kill X { kill-pane } \
    Respawn R { respawn-pane -k } \
    "#{?pane_marked,Unmark,Mark}" m { select-pane -m } \
    "#{?#{>:#{window_panes},1},,-}#{?window_zoomed_flag,Unzoom,Zoom}" z { resize-pane -Z }

# Ctrl+left-drag a pane onto another pane to swap them. MouseDown marks the
# source pane, DragEnd swaps that marked source with the drop target (`=`), and
# MouseUp clears accidental Ctrl-click marks when no drag happened.
# Ctrl, not Shift or Option: Shift+mouse must stay with Ghostty (it's the
# bypass modifier that makes Cmd+Shift+click open links while tmux has the
# mouse), and Option-clicking into an unfocused window makes macOS hide the
# previous app's windows. Ctrl rides along inside the mouse-reporting
# protocol with no macOS side effects.
bind -n C-MouseDown1Pane select-pane -m -t =
bind -n C-MouseDragEnd1Pane swap-pane -d -t = \; select-pane -M
bind -n C-MouseUp1Pane select-pane -M

# Ctrl+left-drag a window tab onto another tab to reposition it, shifting the
# intervening windows. Compare indexes numerically so multi-digit indexes sort
# correctly, and renumber after the move to close the source index. Keep `-d`
# for inactive sources so focus stays put; omit it when focus should follow the
# moved active window.
bind -n C-MouseDown1Status select-pane -m -t =
bind -n C-MouseDragEnd1Status if-shell -F -t = \
    '#{e|==:#{W:#{?window_marked_flag,#{window_index},}},#{window_index}}' \
    { select-pane -M } \
    {
        if-shell -F -t = '#{e|<:#{W:#{?window_marked_flag,#{window_index},}},#{window_index}}' {
            if-shell -F -t = '#{W:#{?window_marked_flag,#{window_active},}}' {
                move-window -a -s '{marked}' -t =
            } {
                move-window -a -d -s '{marked}' -t =
            }
        } {
            if-shell -F -t = '#{W:#{?window_marked_flag,#{window_active},}}' {
                move-window -b -s '{marked}' -t =
            } {
                move-window -b -d -s '{marked}' -t =
            }
        }
        move-window -r -t =
        select-pane -M
    }
bind -n C-MouseUp1Status select-pane -M

# Ctrl-modified variants of the window/split chords above, but launching Claude
# Code directly. Each adds Ctrl to its plain counterpart and inherits its start
# dir: C-M-= new window at $HOME (like M-=), C-M-S-= / C-M-S-- splits in the
# current path (like M-S-= / M-S--); C-M-p opens a new window in the
# $PROJECTS_DIR tree (see zshrc). Ghostty forwards all four as CSI 27 sequences
# (see ghostty/config).
#
# Two non-obvious details:
#   * tmux runs a window/pane command with execvp, NOT a shell — so a bare
#     `claude` would skip the `claude` alias (CLAUDE_CODE_TMUX_TRUECOLOR=1 …
#     --chrome, defined in zshrc) and `$PROJECTS_DIR`/`&&` wouldn't expand.
#     Wrapping in `zsh -ic` runs an interactive shell that sources zshrc, so the
#     alias and env var both apply.
#   * When claude exits, the inner `zsh -ic` exits and the window/pane closes.
#     Append `; exec zsh` inside the -c string if you'd rather drop to a shell.
bind -n 'C-M-='   new-window   -c "#{HOME}" zsh -ic claude
bind -n 'C-M-S-=' split-window -h -c "#{pane_current_path}" zsh -ic claude
bind -n 'C-M-S--' split-window -v -c "#{pane_current_path}" zsh -ic claude
bind -n 'C-M-p'   new-window   zsh -ic 'cd "${PROJECTS_DIR:-$HOME/darwin-ai/darwin-platform}" && claude'

# Alt+Shift+Enter → toggle pane zoom (fullscreen the active pane). Ghostty sends
# `\e[27;4;13~` (modifier 4 = Alt+Shift, code 13 = Enter) directly. With
# extended-keys on, tmux parses that as M-S-Enter. The `prefix + z` default
# still works.
bind -n 'M-S-Enter' resize-pane -Z

# Cmd+Opt+arrow → move focus between panes. Ghostty sends the chords as
# modifier-11 sequences — ESC[1;11{D,C,A,B} (Alt+Super, since Cmd=8 + Opt=2).
# That's a non-standard modifier tmux has no key name for, so register the raw
# sequences as user-keys and bind those. (Plain Option+arrow sends ESC b / ESC
# f, so word motion is unaffected.)
set -s user-keys[0] "\e[1;11D"
set -s user-keys[1] "\e[1;11C"
set -s user-keys[2] "\e[1;11A"
set -s user-keys[3] "\e[1;11B"
bind -n User0 select-pane -L
bind -n User1 select-pane -R
bind -n User2 select-pane -U
bind -n User3 select-pane -D

# Ctrl+L clears the visible screen AND tmux's scrollback (not just the viewport).
# Ghostty's cmd+k is rebound to send \x0c (Ctrl+L), so this is what makes
# cmd+k work inside tmux — without it, cmd+k clears Ghostty's empty outer
# buffer while tmux's scrollback stays intact.
bind -n C-l send-keys C-l \; clear-history

# --- Session persistence across reboots ---
# tmux-resurrect captures and rebuilds the environment (sessions, windows,
# panes, layouts, per-pane cwd). The repo-owned persistence coordinator wraps
# it with serialized 15-minute/detach/manual saves, coherent historical
# sidecars, guarded startup restore, and verification. launchd owns the server;
# Ghostty shells wait briefly for its readiness before attaching.
# Plugins are managed by TPM; /shell-setup §17 clones TPM and Resurrect before
# launchd starts the default server.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'

# Restore each pane's captured history and visible text as a static transcript,
# so restored panes show what they were doing instead of a bare prompt.
set -g @resurrect-capture-pane-contents 'on'

# Programs to relaunch in restored panes, on top of resurrect's conservative
# default whitelist (vim, less, top, …) — anything not matched comes back as
# a bare shell. The quoted entry matches saved pane commands that START with
# "npm start" and re-runs them verbatim in the restored cwd. Claude/Codex are
# deliberately NOT listed here: they'd relaunch as fresh conversations — the
# assistant-resurrect hooks below restart them with their session id instead.
set -g @resurrect-processes '"npm start"'
# Only the coordinator may prune snapshots, so managed triplets stay coherent.
set -g @resurrect-delete-backup-after '36500'

# Save on quit as well as on the agent's 15-minute timer. Every trigger uses
# the same full-duration kernel lock and save-readiness gate; concurrent
# detach events coalesce instead of racing Resurrect's singleton files.
set-hook -g client-detached 'run-shell -b "~/.shell-setup/tmux-persistence.sh save --quiet --coalesce"'

# The layout hook copies Resurrect's just-written candidate before Resurrect may
# delete an unchanged layout. Pre-restore stages that generation's keyed pane
# archive and assistant map; post-restore gates on exact topology and records
# pane cwd differences as diagnostics. It also resumes Claude/Codex conversations.
set -g @resurrect-hook-post-save-layout '~/.shell-setup/tmux-persistence.sh post-save-layout'
set -g @resurrect-hook-post-save-all 'true'
set -g @resurrect-hook-pre-restore-all '~/.shell-setup/tmux-persistence.sh pre-restore'
set -g @resurrect-hook-post-restore-all '~/.shell-setup/tmux-persistence.sh post-restore'

# Initialize TPM, then replace Resurrect's direct bindings in the same
# sequential shell job. A later config line is not sufficient: TPM sources
# plugins asynchronously relative to the surrounding config parse.
run-shell '~/.tmux/plugins/tpm/tpm; tmux bind-key C-s run-shell -b "$HOME/.shell-setup/tmux-persistence.sh save"; tmux bind-key C-r run-shell -b "$HOME/.shell-setup/tmux-persistence.sh restore"'
