set -g mouse on
set -g extended-keys always
set -as terminal-features 'xterm*:extkeys'

# Tell tmux the outer terminal (Ghostty) understands DECSCUSR cursor-shape
# escapes, so cursor-style requests from apps running inside tmux (e.g. zsh
# setting a blinking bar in precmd) are forwarded instead of swallowed. The
# tmux-256color / xterm-256color terminfo entries don't ship Ss/Se by default,
# so this is what enables the pass-through.
set -as terminal-features 'xterm*:cstyle'

# Force a blinking bar cursor across tmux panes — including copy-mode. When
# left at "default", scrolling drops into copy-mode and tmux draws its copy
# cursor as a block. Setting cursor-style makes tmux own the cursor shape, so
# it stays a blinking bar everywhere (and makes the zsh precmd DECSCUSR hack
# redundant inside tmux).
set -g cursor-style blinking-bar

# Bigger scrollback than the stingy 2000-line default.
set -g history-limit 50000

# Forward terminal focus events into tmux (so neovim, etc. can react).
set -g focus-events on

# Number windows/panes from 1 — matches the M-1..M-9 bindings below.
set -g base-index 1
setw -g pane-base-index 1

# When a window is closed, shift later windows down so numbering stays tight.
set -g renumber-windows on

# True color (24-bit) inside tmux — required for themes to look right.
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm*:Tc"

# Selecting text in copy-mode also goes to the macOS clipboard.
set -g set-clipboard on

# Let DCS escape sequences (kitty graphics protocol, sixel images) pass through
# to the outer terminal — useful for image-rendering tools (kitten icat,
# imgcat, sixel-based plots) inside tmux panes.
set -g allow-passthrough on

bind -T copy-mode-vi WheelUpPane   select-pane \; send-keys -X -N 2 scroll-up
bind -T copy-mode-vi WheelDownPane select-pane \; send-keys -X -N 2 scroll-down
bind -T copy-mode    WheelUpPane   select-pane \; send-keys -X -N 2 scroll-up
bind -T copy-mode    WheelDownPane select-pane \; send-keys -X -N 2 scroll-down

# Don't cycle windows when scrolling over the status bar.
unbind -T root WheelUpStatus
unbind -T root WheelDownStatus

set -g status-left ""
set -g status-left-length 0
# Pane title / window / session used to live on status-right, but that crowded
# the bottom bar. Move it to a per-pane line at the top of the screen
# (pane-border-status) so the bottom status line is free for window switching.
set -g status-right ""
set -g status-right-length 0
set -g pane-border-status top
# Per-pane top line: "title │ command" left-aligned, cwd tail right-aligned.
# The active pane is shown in bold color; inactive panes are dimmed grey, and
# the border line itself is colored via pane-active-border-style below.
# (Styles inside #{?pane_active,...} use space-separated attrs — commas would
# be parsed as the conditional's branch separator.)
#
# The cwd is truncated from the start (keeping the tail, prefixed with … only
# when something was actually trimmed), and the truncation length is responsive:
# it fills whatever room is left after the left-aligned "title │ command", with
# no fixed minimum. The width is computed inline with tmux arithmetic (#{e|…}):
#   left  = display width of "title │ command"  (#{w:…}, ignores #[…] styles)
#   dyn   = pane_width - (left + 9)              (see the reserve breakdown below)
#   limit = max(1, dyn)                          (expressed as ?#{e|>:dyn,1})
# The max(1,…) is not a real floor — it only guards the degenerate case: tmux
# treats a truncation limit of 0 (or negative) as "no limit" and would then
# print the *full* path, overflowing a too-narrow border. Clamping to 1 instead
# shows just "…<last char>" when there's no room. Because the cwd is
# right-aligned, growing its limit reveals more of the path leftward into the
# empty middle of a wide border, and shrinks to nothing on a narrow one.
#
# The reserve of 9 = 3 framing spaces (leading space of each segment + the one
# before #[align=right]) + 1 for the prepended … + a ~5-column safety gap. The
# gap matters: if the truncated line filled the pane *exactly*, the right-aligned
# cwd would be anchored to the right edge and its leading … would spill off the
# LEFT edge and get clipped — so the path would look truncated with no ellipsis.
# The gap keeps the whole thing a few columns short of the edge so the … is
# always visible.
#
# Note: there is deliberately NO space between the cwd and the trailing
# #[default] (the path sits flush against the right edge). Ghostty's file-path
# link detection grabs a contiguous run of cells, and a trailing space would be
# pulled into the match — it would then try to open "~/…/path " (with the space)
# and silently fail. Keeping the path the last cell makes Cmd+Shift+click work.
# (Cmd+*Shift*+click because `mouse on` lets tmux capture the mouse; Shift tells
# Ghostty to bypass tmux and handle the click itself.)
set -g pane-border-style "fg=colour238"
set -g pane-active-border-style "fg=colour173"
set -g pane-border-format "#[align=left] #{?pane_active,#[fg=colour173 bold],#[fg=colour244 nobold]}#{pane_title}#[fg=colour240 nobold] │ #{?pane_active,#[fg=colour109 bold],#[fg=colour244 nobold]}#{pane_current_command} #[align=right] #{?pane_active,#[fg=colour108],#[fg=colour240]}#{=/-#{?#{e|>:#{e|-:#{pane_width},#{e|+:#{w:#{pane_title} │ #{pane_current_command}},9}},1},#{e|-:#{pane_width},#{e|+:#{w:#{pane_title} │ #{pane_current_command}},9}},1}/…:#{s|^#{HOME}|~|:pane_current_path}}#[default]"
# Window label is hybrid: while automatic-rename is on (the default) show the
# descriptive pane_title; once you manually rename a window tmux turns
# automatic-rename off, so it switches to showing your custom name (#W).
# Also fall back to pane_title when #W is empty — renaming to "" leaves
# automatic-rename off (tmux doesn't re-enable it), which would otherwise show
# a blank label.
set -g window-status-format " #I:#{?#{||:#{automatic-rename},#{==:#W,}},#{=25:pane_title},#W}#F "
set -g window-status-current-format " #I:#{?#{||:#{automatic-rename},#{==:#W,}},#{=25:pane_title},#W}#F "
set -g window-status-current-style "bg=colour173,fg=black,bold"

# Alt+N → jump to window N (no prefix). Alt is forwarded by Ghostty
# (macos-option-as-alt = true), so these only fire when tmux owns the keys —
# naturally scoping the binding to "inside tmux only".
bind -n M-0 select-window -t 0
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Top-row window navigation: Alt+` next, Alt+Shift+` prev, Alt+= new.
# With extended-keys on, Ghostty sends Alt+Shift+` as the literal backtick
# plus Shift+Alt modifier bits (not the shifted character ~), so we bind the
# explicit-modifier form M-S-` rather than M-~.
# (Alt+Backspace is reserved for delete-word-backward in shell/Claude Code
# via the Ghostty alt+backspace=text:\x17 keybind.)
bind -n M-\` next-window
bind -n 'M-S-`' previous-window
bind -n M-= new-window

# Alt+Shift+= splits right, Alt+Shift+- splits down — mirrors Ghostty's
# ctrl+shift+=/ctrl+shift+- splits, but at the tmux layer (since Ghostty
# consumes its own ctrl+shift bindings before tmux sees them). The matching
# Ghostty keybinds forward these as CSI 27;4;61~ / CSI 27;4;45~ so tmux's
# extended-keys parser recognizes the Shift+Alt modifier bits.
bind -n 'M-S-=' split-window -h -c "#{pane_current_path}"
bind -n 'M-S--' split-window -v -c "#{pane_current_path}"

# Alt+Shift+Enter → toggle pane zoom (fullscreen the active pane). Pairs with
# Ghostty's `performable:alt+shift+enter=toggle_split_zoom`: inside a single
# Ghostty surface running tmux, the chord is non-performable on Ghostty's side
# and falls through, encoded by Ghostty's modifyOtherKeys path as
# `\e[27;4;13~` (modifier 4 = Alt+Shift, code 13 = Enter). With extended-keys
# on, tmux parses that as M-S-Enter. The `prefix + z` default still works.
bind -n 'M-S-Enter' resize-pane -Z

# Cmd+Opt+arrow → move focus between panes. When there's no Ghostty split to
# move to (the usual case inside tmux), Ghostty falls through and encodes the
# chord as modifier 11 — ESC[1;11{D,C,A,B} (Alt+Super, since Cmd=8 + Opt=2).
# That's a non-standard modifier tmux has no key name for, so we register the
# raw sequences as user-keys and bind those. (Plain Option+arrow sends ESC b /
# ESC f, so word motion is unaffected.)
set -s user-keys[0] "\e[1;11D"
set -s user-keys[1] "\e[1;11C"
set -s user-keys[2] "\e[1;11A"
set -s user-keys[3] "\e[1;11B"
bind -n User0 select-pane -L
bind -n User1 select-pane -R
bind -n User2 select-pane -U
bind -n User3 select-pane -D

# Ctrl+L clears the visible screen AND tmux's scrollback (not just the viewport).
# Ghostty's cmd+k is rebound to send \x0c (Ctrl+L), so this is what makes
# cmd+k work inside tmux — without it, cmd+k clears Ghostty's empty outer
# buffer while tmux's scrollback stays intact.
bind -n C-l send-keys C-l \; clear-history

# --- Session persistence across reboots ---
# tmux-resurrect saves/restores the whole environment (sessions, windows,
# panes, layouts, per-pane cwd); tmux-continuum drives it automatically:
# periodic saves (every 15 min by default) and a restore when the tmux server
# starts. Combined with the zshrc auto-start (`tmux new -A -s main` in Ghostty
# shells), quitting Ghostty or rebooting the Mac no longer loses the quick
# terminal's windows — the next summon recreates them.
# Plugins are managed by TPM, bootstrapped by /shell-setup §17 with:
#   git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
#   ~/.tmux/plugins/tpm/bin/install_plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Restore the last saved environment automatically when the server starts.
set -g @continuum-restore 'on'

# Also restore each pane's visible text (a static snapshot — scrollback isn't
# saved), so restored panes show what they were doing instead of a bare prompt.
set -g @resurrect-capture-pane-contents 'on'

# Programs to relaunch in restored panes, on top of resurrect's conservative
# default whitelist (vim, less, top, …) — anything not matched comes back as
# a bare shell. The quoted entry matches saved pane commands that START with
# "npm start" and re-runs them verbatim in the restored cwd. Claude/Codex are
# deliberately NOT listed here: they'd relaunch as fresh conversations — the
# assistant-resurrect hooks below restart them with their session id instead.
set -g @resurrect-processes '"npm start"'

# Save on quit, not just on the 15-min timer. Quitting Ghostty (including the
# automatic quit during macOS shutdown/restart) detaches the tmux client, so
# hooking client-detached snapshots the environment at the last moment the
# layout could have changed — without it, a reboot loses up to 15 min of
# window/pane churn. Harmlessly also fires on manual prefix+d detaches.
# (`-b` = don't block the detach; resurrect's save.sh is idempotent and
# "quiet" suppresses the status-line message.)
set-hook -g client-detached 'run-shell -b "~/.tmux/plugins/tmux-resurrect/scripts/save.sh quiet"'

# Assistant session persistence (Claude Code + Codex CLI) — resurrect brings
# back layout and cwd but leaves assistant panes as bare shells, losing the
# conversation. These hooks (scripts in this repo, symlinked to
# ~/.tmux/assistant-resurrect by /shell-setup §17) save each pane's assistant
# session ID alongside resurrect's files and type `claude --resume <id>` /
# `codex resume <id>` into the restored panes. Claude IDs come from a
# SessionStart hook registered in ~/.claude/settings.json; Codex IDs are read
# from ~/.codex/state_*.sqlite. See tmux/assistant-resurrect/lib.sh.
set -g @resurrect-hook-post-save-all '~/.tmux/assistant-resurrect/save.sh'
set -g @resurrect-hook-post-restore-all '~/.tmux/assistant-resurrect/restore.sh'

# Continuum piggybacks its periodic-save check on status-right rendering: it
# prepends an invisible #(continuum_save.sh) interpolation when it loads. That
# imposes two constraints on this file: the status line must stay on, and the
# `set -g status-right ""` above must run BEFORE the plugins load (it would
# wipe the hook otherwise) — which the run line being last guarantees. The
# hook still fires with status-right-length 0: tmux expands the format (and
# spawns the #() job) before truncating for display.
#
# Initialize TPM — keep this as the LAST line of the file.
run '~/.tmux/plugins/tpm/tpm'
